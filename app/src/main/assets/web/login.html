<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ExamSetu Nepal</title>
  <meta name="description" content="Sign in to your ExamSetu account to track your test scores, saved questions, and progress.">
  <link rel="stylesheet" href="/css/remixicon.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <!-- Header -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="/" class="brand">
        <div class="brand-icon"><i class="ri-book-open-fill"></i></div>
        <div class="brand-title"><span class="brand-name">ExamSetu <span>Nepal</span></span></div>
      </a>
      <div class="nav-actions">
        <button id="themeToggleBtn" class="theme-toggle-btn"><i class="ri-moon-line"></i></button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container">

      <div class="auth-wrapper">
        <div class="auth-header">
          <div style="width:52px;height:52px;background:var(--primary-light);color:var(--primary);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 14px;">
            <i class="ri-user-shared-line"></i>
          </div>
          <h1 class="auth-title">Welcome Back</h1>
          <p style="color:var(--muted-text);font-size:0.92rem;">Sign in to continue your MCQ exam practice</p>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" id="email" class="form-input" placeholder="name@example.com" required autocomplete="email">
          </div>

          <div class="form-group">
            <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
              <label for="password" class="form-label" style="margin-bottom:0;">Password</label>
              <a href="#" onclick="alert('For testing, please use the 1-Click Demo accounts below.');return false;" style="font-size:0.8rem;">Forgot password?</a>
            </div>
            <input type="password" id="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:10px;">
            Sign In to ExamSetu
          </button>
        </form>

        <!-- 1-Click Demo Accounts for Test Evaluation -->
        <div class="demo-account-box">
          <div style="font-weight:700;color:var(--text);margin-bottom:6px;"><i class="ri-flashlight-line" style="color:var(--accent);"></i> Quick-Fill Demo Logins</div>
          <p style="color:var(--muted-text);font-size:0.8rem;margin-bottom:10px;">Click either button to autofill credentials instantly:</p>
          <div class="demo-btn-group">
            <button type="button" class="btn btn-secondary btn-sm" onclick="fillCredentials('student@examsetu.com', 'student123')" style="flex:1;">
              <i class="ri-user-line"></i> Student Account
            </button>
            <button type="button" class="btn btn-secondary btn-sm" onclick="fillCredentials('admin@examsetu.com', 'ChangeThisStrongPassword123')" style="flex:1;">
              <i class="ri-shield-user-line"></i> Admin Account
            </button>
          </div>
        </div>

        <div style="text-align:center;margin-top:24px;font-size:0.9rem;color:var(--muted-text);">
          Don't have an account yet? <a href="/register" style="font-weight:700;">Create free account</a>
        </div>
      </div>

    </div>
  </main>

  <footer class="footer">
    <div class="container footer-bottom">
      <div>&copy; 2026 ExamSetu Nepal.</div>
      <div><a href="/privacy" style="color:var(--muted-text);">Privacy</a> • <a href="/terms" style="color:var(--muted-text);">Terms</a></div>
    </div>
  </footer>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="mobile-bottom-nav">
    <a href="/" class="bottom-nav-item">
      <i class="ri-home-5-line"></i>
      <span>Home</span>
    </a>
    <a href="/exams" class="bottom-nav-item">
      <i class="ri-book-read-line"></i>
      <span>Exams</span>
    </a>
    <a href="/practice?exam=Lok+Sewa" class="bottom-nav-item">
      <i class="ri-flashlight-line"></i>
      <span>Practice</span>
    </a>
    <a href="/test?exam=Lok+Sewa&subject=General+Knowledge" class="bottom-nav-item">
      <i class="ri-timer-line"></i>
      <span>Mock Test</span>
    </a>
    <a href="/dashboard" class="bottom-nav-item">
      <i class="ri-user-smile-line"></i>
      <span>Dashboard</span>
    </a>
  </nav>

  <script src="/js/examsetu-data.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
