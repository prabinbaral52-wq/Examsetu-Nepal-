<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice Exam in Progress - ExamSetu Nepal</title>
  <meta name="description" content="Online timed MCQ examination for Lok Sewa, SEE, NEB, and Banking. Answer questions with instant palette navigation.">
  <link rel="stylesheet" href="/css/remixicon.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body id="practiceTestPage">

  <!-- Minimal Sticky Exam Header -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="/" class="brand" onclick="return confirm('Leaving now will pause your timer. Are you sure you want to exit?')">
        <div class="brand-icon"><i class="ri-book-open-fill"></i></div>
        <div class="brand-title">
          <span class="brand-name">ExamSetu <span>Nepal</span></span>
        </div>
      </a>

      <!-- Center Timer Display -->
      <div id="testTimer" class="timer-box" aria-live="polite">
        <i class="ri-timer-line"></i> <span>20:00</span>
      </div>

      <div class="nav-actions">
        <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle dark mode">
          <i class="ri-moon-line"></i>
        </button>
        <button id="submitTestBtn" class="btn btn-primary btn-sm">
          <i class="ri-check-double-line"></i> Finish & Submit
        </button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container">

      <!-- Test Configuration Bar: Custom Count & Shuffle -->
      <div style="background:var(--glass-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1.5px solid var(--border);border-radius:var(--radius-md);padding:12px 20px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;box-shadow:var(--clay-shadow);">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <label for="testCountSelect" style="font-size:0.88rem;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;">
            <i class="ri-list-check-2" style="color:var(--primary);font-size:1.1rem;"></i> Test Length:
          </label>
          <select id="testCountSelect" onchange="TestEngine.changeTestCount(this.value)" style="padding:6px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);font-weight:700;color:var(--text);outline:none;cursor:pointer;">
            <option value="10">10 Questions (10 Mins)</option>
            <option value="25">25 Questions (25 Mins)</option>
            <option value="50">50 Questions (45 Mins)</option>
            <option value="100">100 Questions (90 Mins)</option>
            <option value="150">150 Questions (135 Mins)</option>
            <option value="200">200 Questions (180 Mins)</option>
            <option value="299">299 Questions (Full Mock Marathon)</option>
          </select>
        </div>

        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button onclick="window.print()" class="btn btn-secondary btn-sm" title="Print this mock paper or save as PDF">
            <i class="ri-printer-line"></i> 🖨️ Print Exam
          </button>
          <button onclick="TestEngine.shuffleNewTest()" class="btn btn-secondary btn-sm" title="Generate a fresh random mock test with new questions">
            <i class="ri-refresh-line"></i> 🎲 Generate New Questions (Shuffle)
          </button>
        </div>
      </div>

      <!-- Test Header Details -->
      <div class="progress-container">
        <div class="progress-header">
          <span id="testExamTitle" style="font-weight:700;color:var(--text);">Lok Sewa • General Practice</span>
          <span id="progressText">0% Answered</span>
        </div>
        <div class="progress-bar-track">
          <div id="progressBarFill" class="progress-bar-fill" style="width: 0%;"></div>
        </div>
      </div>

      <!-- Main Layout: Question + Palette -->
      <div class="test-layout">

        <!-- Question Main Area -->
        <div class="test-main-card">
          <div id="questionDisplayArea">
            <!-- Dynamic Question injected here by test.js -->
            <div style="text-align:center;padding:50px;">
              <i class="ri-loader-4-line ri-spin" style="font-size:2.5rem;color:var(--primary);"></i>
              <p style="margin-top:12px;color:var(--muted-text);">Loading question bank...</p>
            </div>
          </div>

          <!-- Bottom Actions Bar -->
          <div class="test-actions-bar">
            <div class="action-left-group">
              <button id="prevQBtn" class="btn btn-secondary btn-sm" disabled>
                <i class="ri-arrow-left-line"></i> Previous
              </button>
              <button id="clearQBtn" class="btn btn-secondary btn-sm" title="Clear selection for this question">
                <i class="ri-eraser-line"></i> Clear
              </button>
              <button id="flagQBtn" class="btn btn-secondary btn-sm btn-flag" title="Mark to revisit later">
                <i class="ri-flag-line"></i> Mark for Review
              </button>
            </div>

            <div class="action-right-group">
              <button id="nextQBtn" class="btn btn-primary">
                Next Question <i class="ri-arrow-right-line"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- Question Palette Sidebar -->
        <aside class="palette-card">
          <div class="palette-title">
            <span>Question Palette</span>
            <span id="answeredStatCount" class="tag-badge tag-badge-primary">0 / 0</span>
          </div>

          <div id="paletteGrid" class="palette-grid">
            <!-- Numbers injected dynamically -->
          </div>

          <div class="palette-legend">
            <div class="legend-item">
              <span class="legend-dot dot-answered"></span>
              <span>Answered</span>
            </div>
            <div class="legend-item">
              <span class="legend-dot dot-flagged"></span>
              <span>Flagged</span>
            </div>
            <div class="legend-item">
              <span class="legend-dot dot-unattempted"></span>
              <span>Unattempted</span>
            </div>
            <div class="legend-item">
              <span class="legend-dot dot-current"></span>
              <span>Current</span>
            </div>
          </div>

          <!-- Keyboard Shortcuts Tip -->
          <div style="margin-top:20px;padding:12px;background:var(--surface-alt);border-radius:var(--radius-sm);font-size:0.75rem;color:var(--muted-text);line-height:1.4;">
            <i class="ri-keyboard-line"></i> <strong>Pro Tip:</strong> Press keys <kbd>A</kbd>, <kbd>B</kbd>, <kbd>C</kbd>, <kbd>D</kbd> to pick options, or Arrow Keys <kbd>←</kbd> <kbd>→</kbd> to navigate.
          </div>
        </aside>

      </div>

    </div>
  </main>

  <script src="/js/main.js"></script>
  <script src="/js/test.js"></script>
</body>
</html>
