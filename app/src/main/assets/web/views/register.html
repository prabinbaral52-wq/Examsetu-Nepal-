<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Free Account - ExamSetu Nepal</title>
  <meta name="description" content="Register free on ExamSetu Nepal to take timed mock exams, save bookmarks, and track your Lok Sewa, SEE, and Banking progress.">
  <link rel="stylesheet" href="/css/remixicon.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <!-- Header -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="/" class="brand">
        <div class="brand-icon"><i class="ri-book-open-fill"></i></div>
        <div class="brand-title"><span class="brand-name">ExamSetu <span>Nepal</span></span></div>
      </a>
      <div class="nav-actions">
        <button id="themeToggleBtn" class="theme-toggle-btn"><i class="ri-moon-line"></i></button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container">

      <div class="auth-wrapper">
        <div class="auth-header">
          <div style="width:52px;height:52px;background:var(--success-light);color:var(--success);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 14px;">
            <i class="ri-user-add-line"></i>
          </div>
          <h1 class="auth-title">Create Free Account</h1>
          <p style="color:var(--muted-text);font-size:0.92rem;">Join thousands of students preparing across Nepal</p>
        </div>

        <form id="registerForm">
          <div class="form-group">
            <label for="name" class="form-label">Full Name</label>
            <input type="text" id="name" class="form-input" placeholder="e.g. Ramesh Adhikari" required autocomplete="name">
          </div>

          <div class="form-group">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" id="email" class="form-input" placeholder="ramesh@example.com" required autocomplete="email">
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password (Minimum 6 characters)</label>
            <input type="password" id="password" class="form-input" placeholder="Create a strong password" minlength="6" required autocomplete="new-password">
          </div>

          <div style="font-size:0.8rem;color:var(--muted-text);margin-bottom:18px;line-height:1.4;">
            By registering, you agree to our <a href="/terms">Terms</a> and acknowledge our <a href="/privacy">Privacy Policy</a>.
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg">
            Create Free Account
          </button>
        </form>

        <div style="text-align:center;margin-top:24px;font-size:0.9rem;color:var(--muted-text);">
          Already have an account? <a href="/login" style="font-weight:700;">Sign in here</a>
        </div>
      </div>

    </div>
  </main>

  <footer class="footer">
    <div class="container footer-bottom">
      <div>&copy; 2026 ExamSetu Nepal.</div>
      <div><a href="/disclaimer" style="color:var(--muted-text);">Disclaimer</a></div>
    </div>
  </footer>

  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
