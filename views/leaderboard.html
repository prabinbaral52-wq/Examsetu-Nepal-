<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard - ExamSetu Nepal</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div class="container" style="max-width:700px;margin:40px auto;padding:20px;">
    <h1>🏆 Leaderboard</h1>
    <p>Top students on ExamSetu Nepal</p>
    <div id="leaderboard">Loading...</div>
  </div>
  <script>
    async function loadLeaderboard() {
      try {
        const res = await fetch('/api/leaderboard');
        const data = await res.json();
        const el = document.getElementById('leaderboard');
        if (!data.leaderboard || data.leaderboard.length === 0) {
          el.innerHTML = '<p>Leaderboard will show top users once more students join and earn XP. Keep practicing!</p>';
          return;
        }
        el.innerHTML = '<ol>' + data.leaderboard.map((u, i) =>
          `<li style="margin:10px 0;padding:10px;background:#f8fafc;border-radius:8px;">#${i+1} ${u.name} — ${u.total_xp || 0} XP</li>`
        ).join('') + '</ol>';
      } catch (e) {
        document.getElementById('leaderboard').innerHTML = 'Error loading leaderboard.';
      }
    }
    loadLeaderboard();
  </script>
</body>
</html>
